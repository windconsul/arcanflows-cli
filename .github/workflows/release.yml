# ArcanFlows CLI release workflow.
#
# Lives at the root of the public repo (windconsul/arcanflows-cli).
# Triggers on tag push:  git tag v0.7.2 && git push origin v0.7.2
# Builds 5 platform binaries, generates SHA-256 checksums, and creates
# a GitHub Release with all of them attached.
name: Release CLI

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: darwin
            arch: arm64
          - os: darwin
            arch: amd64
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: windows
            arch: amd64

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.24'
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BINARY="arcanflows-${{ matrix.os }}-${{ matrix.arch }}"
          if [ "${{ matrix.os }}" = "windows" ]; then
            BINARY="${BINARY}.exe"
          fi
          mkdir -p dist
          go build -ldflags "-s -w -X github.com/arcanflows/cli/cmd.Version=${VERSION}" -o "dist/${BINARY}" .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: arcanflows-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist/
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum arcanflows-* > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ArcanFlows CLI ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/arcanflows-*
            dist/checksums.txt
          body: |
            ## ArcanFlows CLI ${{ github.ref_name }}

            ### Quick install

            ```sh
            # macOS / Linux — installs latest to /usr/local/bin
            curl -fsSL https://raw.githubusercontent.com/windconsul/arcanflows-cli/main/install.sh | sh

            # Pin this version
            curl -fsSL https://raw.githubusercontent.com/windconsul/arcanflows-cli/main/install.sh | \
              ARCANFLOWS_CLI_VERSION=${{ github.ref_name }} sh

            # Install to ~/.local/bin without sudo
            curl -fsSL https://raw.githubusercontent.com/windconsul/arcanflows-cli/main/install.sh | \
              ARCANFLOWS_CLI_INSTALL_DIR="$HOME/.local/bin" sh
            ```

            ### Homebrew (macOS / Linux)

            ```sh
            brew tap windconsul/arcanflows-cli https://github.com/windconsul/arcanflows-cli
            brew install windconsul/arcanflows-cli/arcanflows
            ```

            ### Verify
            ```sh
            sha256sum -c checksums.txt
            arcanflows --help
            ```

      # The formula on main must point at the newest release with real
      # SHA-256 sums; generating it here means it can never go stale.
      - name: Update the Homebrew formula on main
        run: |
          git fetch --depth 1 origin main
          git checkout -B main origin/main
          scripts/homebrew-formula.sh "$GITHUB_REF_NAME" dist/checksums.txt > Formula/arcanflows.rb
          if git diff --quiet -- Formula/arcanflows.rb; then echo "formula already current"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/arcanflows.rb
          git commit -m "chore: Homebrew formula for $GITHUB_REF_NAME"
          git push origin main
